name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Apply D1 migrations against a local (in-memory) database
        # A real, automated correctness check on every PR — this actually creates the
        # schema and runs the seed data against wrangler's local D1 (SQLite), catching
        # broken migration SQL before it ever reaches a real database. No Cloudflare
        # credentials required for --local.
        run: npx wrangler d1 migrations apply flowfunds-db --local
      - name: Build
        run: npm run build

  deploy:
    name: Deploy (main only)
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

      # Applies any new migrations against the real remote D1 database. Requires
      # database_id in wrangler.jsonc to already point at a real D1 database (created
      # once via `wrangler d1 create flowfunds-db`) — this workflow doesn't create the
      # database itself, only migrates it, so a fresh environment needs that one manual
      # bootstrap step before this job can run for the first time.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply flowfunds-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name flowfunds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # PLAID_CLIENT_ID / PLAID_SECRET / PLAID_ENV / JWT_SECRET are Worker secrets, set
      # once via `wrangler secret put <NAME>` and persisted on the Cloudflare side — not
      # re-supplied on every deploy, so this workflow never needs to see their values.
